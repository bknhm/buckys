* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body {
  min-height: 100svh;
  overflow: hidden;
  background: var(--green);
  color: var(--cream);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
.stage {
  position: relative;
  display: grid;
  min-height: 100svh;
  place-items: center;
  isolation: isolate;
  overflow: hidden;
  padding: 24px;
}
.logo-swarm { position: absolute; inset: -3%; z-index: -1; pointer-events: none; }
.stamp {
  position: absolute; display: block; width: var(--w, clamp(64px, 10vw, 150px));
  aspect-ratio: 1000 / 278; background: var(--cream);
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
  opacity: var(--o, .18); transform: rotate(var(--r, 0deg));
  animation: drift var(--d, 9s) ease-in-out infinite alternate; animation-delay: var(--delay, 0s);
}
.content { text-align: center; position: relative; z-index: 1; width: min(100%, 850px); }
.code {
